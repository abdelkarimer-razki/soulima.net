<div class="playerContainer">
	<a routerLink="/" class="backBtn">
		<svg class="backIcon" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M21 11H6.414l5.293-5.293-1.414-1.414L2.586 12l7.707 7.707 1.414-1.414L6.414 13H21z"/></svg>
		Back to Movies
	</a>
	
	<div class="moviePlayer">
		<iframe id="vidsrc" class="movie" [src]="link" frameborder="0" referrerpolicy="origin" allowfullscreen="true" allow="picture-in-picture">
		</iframe>
	</div>

	<div class="serverSelector">
		<span class="serverTitle">Select Server Provider:</span>
		<div class="serverButtons">
			<button *ngFor="let server of servers; let i = index" 
				class="serverBtn" 
				[class.active]="selectedServerIndex === i" 
				(click)="selectServer(i)">
				{{ server.name }}
			</button>
		</div>
		<p class="serverWarning">⚠️ Note: If the movie doesn't load or displays an error, try switching to a different server above.</p>
	</div>
</div>
