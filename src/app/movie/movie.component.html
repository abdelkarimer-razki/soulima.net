<div class="playerContainer">
	<div class="playerControls">
		<a routerLink="/" class="backBtn">
			<svg class="backIcon" height="16" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M21 11H6.414l5.293-5.293-1.414-1.414L2.586 12l7.707 7.707 1.414-1.414L6.414 13H21z"/></svg>
			Back to Movies
		</a>
	</div>

	<div class="moviePlayer">
		<iframe id="vidsrc" class="movie" [src]="link" frameborder="0" referrerpolicy="origin" allowfullscreen="true" allow="picture-in-picture">
		</iframe>
	</div>

	<div class="serverSelector">
		<span class="serverTitle">Select Server Provider:</span>
		<div class="serverButtons">
			<button *ngFor="let server of servers; let i = index"
				class="serverBtn"
				[class.active]="selectedServerIndex === i"
				(click)="selectServer(i)">
				<span class="statusDot" [class.online]="serverStatus[i] === 'online'" [class.offline]="serverStatus[i] === 'offline'" [class.checking]="serverStatus[i] === 'checking'"></span>
				{{ server.name }}
			</button>
		</div>
		<div class="serverFooter">
			<span class="serverWarning">⚠️ Switch servers if the movie doesn't load.</span>
			<button class="reportBtn" (click)="reportUnavailable(selectedServerIndex)">Media unavailable on this server? Mark as ✕</button>
		</div>
	</div>

	<div class="downloadSection">
		<div class="downloadHeader">
			<svg class="downloadIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M12 15L12 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
				<path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M3 19H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
			</svg>
			<span class="downloadTitle">Download Movie</span>
		</div>
		<p class="downloadDesc">Search and download this movie in multiple quality options (4K, 1080p, 720p…) to watch offline.</p>
		<div class="downloadActions">
			<button class="downloadBtn" (click)="openDownload()">
				<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
					<path d="M12 15L12 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
					<path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
					<path d="M3 19H21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
				</svg>
				Download via YTS
			</button>
		</div>
		<p class="downloadNote">📌 Opens YTS in a new tab — search for your movie and pick a torrent quality. Best for movies.</p>
	</div>
</div>
