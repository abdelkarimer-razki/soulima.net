<div class="playerContainer">
	<!-- Netflix-like Video Player Container -->
	<div class="moviePlayerWrapper" (mousemove)="showPlayerControls()" (click)="showPlayerControls()" [class.controlsActive]="showControls">
		
		<!-- Buffering / Server Checker Centered Loader (only while checking AND no server found yet) -->
		<div class="playerLoaderOverlay" *ngIf="isCheckingServers() && !hasOnlineServer()">
			<div class="circleSpinner"></div>
			<span class="loaderText">Checking working servers...</span>
		</div>

		<!-- Transparent Overlay Layer -->
		<div class="playerOverlay">
			<!-- Top Controls Bar -->
			<div class="overlayTopBar">
				<a routerLink="/" class="overlayBackBtn">
					<svg class="backIcon" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M21 11H6.414l5.293-5.293-1.414-1.414L2.586 12l7.707 7.707 1.414-1.414L6.414 13H21z"/></svg>
					<span>Back</span>
				</a>

				<div class="overlayTitle">
					<ng-container *ngIf="!loading; else titleSkeleton">
						<h1 class="overlayMovieTitle">Watch {{ movie?.title || movie?.original_title }}</h1>
						<span class="overlayMovieInfo" *ngIf="movie?.release_date">{{ movie?.release_date | date:'yyyy' }}</span>
					</ng-container>
					<ng-template #titleSkeleton>
						<div class="skeleton-title shimmer"></div>
						<div class="skeleton-subtitle shimmer"></div>
					</ng-template>
				</div>

				<div class="overlayRightActions">
					<!-- Server Selector Dropdown -->
					<div class="serverDropdownWrapper" (click)="$event.stopPropagation()">
						<button class="overlayActionBtn" (click)="toggleServerDropdown($event)">
							<svg class="serverIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
							<span>Servers</span>
						</button>
						
						<!-- Dropdown Menu -->
						<div class="serverDropdownMenu" [class.show]="showServerDropdown">
							<div class="dropdownHeader">Choose Server Provider:</div>
							<div class="dropdownList">
								<ng-container *ngFor="let server of servers; let i = index">
									<button *ngIf="serverStatus[i] === 'online'" 
											class="dropdownItem" 
											[class.active]="selectedServerIndex === i"
											(click)="selectServer(i); toggleServerDropdown()">
										<span class="statusDot online"></span>
										<span class="serverNameText">{{ server.name }}</span>
										<span class="activeCheck" *ngIf="selectedServerIndex === i">✓</span>
									</button>
								</ng-container>
							</div>
							<div class="dropdownDivider"></div>
							<div class="dropdownFooter">
								<span class="serverWarning">⚠️ Switch servers if the movie doesn't load.</span>
								<button class="dropdownReportBtn" (click)="reportUnavailable(selectedServerIndex); toggleServerDropdown()">Media unavailable? Mark as ✕</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<app-custom-player [iframeSrc]="link" [title]="movie?.title" (iframeError)="onIframeError()">
		</app-custom-player>
	</div>

</div>
