<div class="offlinePlayerContainer">

  <!-- Full-page player, same experience as online movies / series -->
  <div class="torrentPlayerWrapper" *ngIf="videoUrl">
    <app-torrent-player
      [directUrl]="videoUrl"
      [directSubtitleUrl]="subtitleUrl"
      [directSubtitleName]="subtitleName"
      [title]="title"
      [info]="info"
      [posterUrl]="posterUrl"
      [backdropUrl]="backdropUrl"
      [knownDuration]="knownDuration"
      [showBack]="true"
      backLink="/downloads">
    </app-torrent-player>
  </div>

  <div class="downloadsControls" *ngIf="videoUrl">
    <label class="subtitleBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <span>{{ subtitleName ? subtitleName : 'Load Subtitles (.vtt / .srt)' }}</span>
      <input type="file" accept=".vtt,.srt" (change)="onSubtitleSelected($event)" hidden>
    </label>
  </div>

  <div class="offlineLoading" *ngIf="loading && !error && !videoUrl">
    <span class="offlineLoadingText">Loading your download…</span>
  </div>

  <div class="offlineError" *ngIf="error && !videoUrl">
    <span class="offlineErrorIcon">⚠️</span>
    <span class="offlineErrorText">{{ error }}</span>
    <a routerLink="/downloads" class="offlineBackBtn">
      <svg class="backIcon" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M21 11H6.414l5.293-5.293-1.414-1.414L2.586 12l7.707 7.707 1.414-1.414L6.414 13H21z"/></svg>
      Back to My Downloads
    </a>
  </div>

</div>
