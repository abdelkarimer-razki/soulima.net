<div class="playerContainer">
  <div class="playerContent">
    <iframe
      [src]="iframeSrc"
      class="iframePlayer"
      frameborder="0"
      allowfullscreen="true"
      referrerpolicy="origin"
      allow="picture-in-picture"
      (error)="iframeError.emit()">
    </iframe>
  </div>
</div>
