<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=/">
  <title>Redirecting...</title>
  <script>
    // JavaScript to handle the redirection
    window.onload = function() {
      // Redirect the user to the home page ("/") when they land on a 404 page
      window.location.replace("/");
    };
  </script>
</head>
<body>
  <p>If you are not redirected, <a href="/">click here</a>.</p>
</body>
</html>
